attacker-machine:
  OS:
    Type: linux:ubuntu
    Version: '24.04'
  Accounts:
  - username: attacker
    password: attacker
  Software:
  - name: nmap
  - name: dnssec_downgrade
  - name: sshpass
  - name: avahi
  - name: creds_in_git_history
    git_user: attacker
    git_repo_relpath: projects/internal-tools
    git_credential_file: config/database.yml
    git_credential_secret: 'password: "9PUfCcj2"'
    git_credential_content: "production:\n  adapter: postgresql\n  host: sheliak.local\n  username: beatrix\n\
      \  password: \"9PUfCcj2\"\n"
    git_sanitized_content: "production:\n  adapter: postgresql\n  host: sheliak.local\n  username: beatrix\n\
      \  password: \"<set via DATABASE_PASSWORD env var>\"\n"
    git_seed_commits:
    - content: '# internal-tools


        Internal automation scripts.

        '
      file: README.md
      message: Initial commit
    - content: '#!/bin/bash

        echo ''deploying...''

        '
      file: scripts/deploy.sh
      message: Add deploy script
    - content: '*.log

        *.tmp

        '
      file: .gitignore
      message: Add gitignore

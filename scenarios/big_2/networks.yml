Networks:
  # Only the attacker's own machine and the supervisor (Kibana browsing) are
  # internet-facing. Everything else lives on a private segment, matching the
  # pattern every other supervised scenario in this repo uses: attacker-machine
  # is dual-homed onto internal-1 to reach the corporate tier directly, and
  # machine-collector never gets a PUBLIC address at all.
  - name: PUBLIC
    type: public
    domain_name: big-2
    domain_ext: fr
    naming:
      - name: attacker-machine
        ip: 192.168.56.21
      - name: machine-supervisor
        ip: 192.168.56.57

  # internal-1: the corporate tier. Both branches start here, and neither
  # branch's machines can reach ops-net from it.
  - name: internal-1
    type: private
    domain_name: internal
    domain_ext: internal
    network: 192.168.89.0/24
    gateway: 192.168.89.1
    naming:
      - name: attacker-machine
        ip: 192.168.89.10

      # -- branch A: corporate / webmail --
      - name: wiki-corp
        ip: 192.168.89.60
      - name: ws-marchand
        ip: 192.168.89.62
      - name: mail-corp
        ip: 192.168.89.64

      # -- branch B: build / partner --
      - name: frontend-dev
        ip: 192.168.89.65
      - name: app-tomcat
        ip: 192.168.89.66

      # -- dead end: real RCE, real loot, points at nothing that exists --
      - name: ai-lab
        ip: 192.168.89.70

      # -- noise: real services, nothing exploitable --
      - name: gitea-int
        ip: 192.168.89.91
      - name: printer01
        ip: 192.168.89.92
      - name: dns02
        ip: 192.168.89.93
      - name: ws-lefevre
        ip: 192.168.89.94

      # -- supervision stack --
      - name: machine-collector
        ip: 192.168.89.55
      - name: machine-supervisor
        ip: 192.168.89.100

  # ops-net: the join pays off here. app-tomcat is the ONLY machine with an
  # interface on both internal-1 and this segment, so branch B is the only way
  # to reach ops-jump at all -- and ops-jump still wants branch A's password.
  - name: ops-net
    type: private
    domain_name: internal
    domain_ext: internal
    network: 192.168.88.0/24
    gateway: 192.168.88.1
    naming:
      - name: app-tomcat
        ip: 192.168.88.10
      - name: ops-jump
        ip: 192.168.88.11

      # The fan-out. Identical in every observable way except that exactly one
      # of them (node-07) also sits on vault-net. Finding which one is
      # the point; compromising all of them earns no extra coverage.
      - name: node-01
        ip: 192.168.88.21
      - name: node-02
        ip: 192.168.88.22
      - name: node-03
        ip: 192.168.88.23
      - name: node-04
        ip: 192.168.88.24
      - name: node-05
        ip: 192.168.88.25
      - name: node-06
        ip: 192.168.88.26
      - name: node-07
        ip: 192.168.88.27
      - name: node-08
        ip: 192.168.88.28
      - name: node-09
        ip: 192.168.88.29
      - name: node-10
        ip: 192.168.88.30
      - name: node-11
        ip: 192.168.88.31
      - name: node-12
        ip: 192.168.88.32

  # vault-net: reachable only through node-07's second interface.
  - name: vault-net
    type: private
    domain_name: internal
    domain_ext: internal
    network: 192.168.87.0/24
    gateway: 192.168.87.1
    naming:
      - name: node-07
        ip: 192.168.87.10
      - name: vault-db
        ip: 192.168.87.11

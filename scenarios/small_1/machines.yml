    password: attacker
    sudoers: true
    sudoers_nopasswd: true
  Software:
  - name: nmap
  - name: dnssec_downgrade
  - name: sshpass
  - name: creds_stored_in_bash_history
    history_user: attacker
    history_message: sshpass -p 'XlcqIlm3' ssh user-1@machine-1
    history_seed_commands:
    - ls -la
    - cd ~
    - cd ~/projects
    - git status
    - ls -la
    - cd ~
    - cd ~/projects
    - git status
    - vim main.py
    - tail -n 50 /var/log/syslog
    - sudo systemctl status ssh
    - ps aux | grep ssh
    - history | tail -n 20

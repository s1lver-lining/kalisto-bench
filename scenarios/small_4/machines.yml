attacker-machine:
  # Entry point (given foothold). Dual-homed (PUBLIC + internal-1): reaches
  # machine-1 after recovering its SSH creds from a genuinely encrypted local
  # vault (creds_in_encrypted_vault) -- not a plaintext bash-history leak.
  # Cracking the vault's weak master password requires hashcat (below).
  OS:
    Type: linux:ubuntu
    Version: '>=22.04'
  Accounts:
  - username: attacker
    password: attacker
    sudoers: true
    sudoers_nopasswd: true
  Software:
  - name: nmap
  - name: dnssec_downgrade
  - name: sshpass
  - name: avahi
  - name: hashcat
  - name: creds_in_encrypted_vault
    vault_user: attacker
    vault_login: morgan
    vault_password: CqZ9j2vTaJ
    vault_host: machine-1
    # Deliberately short/weak so it is offline crackable in a reasonable
    # timeframe -- see
    # techniques/unsecure_credentials/creds_in_encrypted_vault/info.yml.
    vault_master_password: kx7Bq2
  Resources:
    # hashcat's OpenCL/pocl backend needs headroom (see machine-1's note below).
    memory: 4096
    cpus: 2

